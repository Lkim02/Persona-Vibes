<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitter Activity Monitor</title>
  <style>
    body {
      width: 400px;
      height: 600px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    #root {
      width: 100%;
      height: 100%;
    }
    /* 添加一个加载指示器，在 React 应用加载之前显示 */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      width: 100%;
      font-size: 16px;
      color: #666;
    }
  </style>
  <link rel="stylesheet" href="assets/index.css">
</head>
<body>
  <div id="root">
    <div class="loading">Loading Twitter Activity Monitor...</div>
  </div>
  <script src="assets/index.js"></script>
  <script src="popup.js"></script>
</body>
</html>
